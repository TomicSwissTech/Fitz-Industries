kind = "web"
previewPath = "/"
title = "Fitz Industries"
version = "1.0.0"
id = "artifacts/fitz-industries"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18170

[services.development]
run = "pnpm --filter @workspace/fitz-industries run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitz-industries", "run", "build" ]
publicDir = "artifacts/fitz-industries/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18170"
BASE_PATH = "/"
